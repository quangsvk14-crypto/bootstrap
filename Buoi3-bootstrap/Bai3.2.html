<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.2: Tạo button group theo mẫu</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>

        <main class="container my-5">
            <h1 class="mb-4">BÀI TẬP CHƯƠNG 3 - Bài 3.2: Tạo button group theo mẫu</h1>

            <section class="mb-5">
                <h4>a) Button group cơ bản</h4>
                <div class="mt-3">
                    <div class="btn-group" role="group" aria-label="Basic button group">
                        <button type="button" class="btn btn-secondary">Home</button>
                        <button type="button" class="btn btn-secondary">About</button>
                        <button type="button" class="btn btn-secondary">Services</button>
                    </div>
                </div>
            </section>

            <hr>

            <section class="mb-5">
                <h4>b) Button group với Icon</h4>
                <div class="mt-3">
                    <div class="btn-group" role="group" aria-label="Action button group">
                        <button type="button" class="btn btn-secondary">
                            <i class="bi bi-eye"></i> View
                        </button>
                        <button type="button" class="btn btn-secondary">
                            <i class="bi bi-pencil"></i> Edit
                        </button>
                        <button type="button" class="btn btn-secondary">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </div>
                </div>
            </section>

            <hr>

            <!-- 3.2c: Button Toolbar -->
            <section class="mb-5">
                <h4>c) Toolbar soạn thảo (btn-toolbar)</h4>
                <div class="mt-3">
                    <div class="btn-toolbar" role="toolbar" aria-label="Toolbar formatting">
                
                        <div class="btn-group me-2" role="group">
                            <button type="button" class="btn btn-secondary"><strong>T</strong></button>
                            <button type="button" class="btn btn-secondary"><strong>B</strong></button>
                            <button type="button" class="btn btn-secondary"><em>I</em></button>
                            <button type="button" class="btn btn-secondary"><u>U</u></button>
                        </div>

                        <div class="btn-group me-2" role="group">
                            <button type="button" class="btn btn-secondary"><i class="bi bi-text-left"></i></button>
                            <button type="button" class="btn btn-secondary"><i class="bi bi-text-center"></i></button>
                            <button type="button" class="btn btn-secondary"><i class="bi bi-text-right"></i></button>
                            <button type="button" class="btn btn-secondary"><i class="bi bi-justify"></i></button>
                        </div>

                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-secondary"><i class="bi bi-code-slash"></i></button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <!-- place footer here -->
        </footer>

        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
