<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.1: Tổng hợp các loại Button</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>

        <main class="container my-5">
            <h1 class="mb-4">BÀI TẬP CHƯƠNG 3 - Bài 3.1: Tạo các Buttons theo mẫu</h1>

            <!-- 3.1a: Định nghĩa các class buttons -->
            <section class="mb-5">
                <h4>a) Định nghĩa các class buttons</h4>
                <div class="mt-3 d-flex flex-wrap gap-2">
                    <button type="button" class="btn">Default Button</button>
                    <button type="button" class="btn btn-primary">Primary Button</button>
                    <button type="button" class="btn btn-success">Success Button</button>
                    <button type="button" class="btn btn-info">Info Button</button>
                    <button type="button" class="btn btn-warning">Warning Button</button>
                    <button type="button" class="btn btn-danger">Danger Button</button>
                    <button type="button" class="btn btn-link">Link Button</button>
                </div>
            </section>

            <hr>

            <!-- 3.1b: Button với đường viền -->
            <section class="mb-5">
                <h4>b) Button với đường viền</h4>
                <div class="mt-3 d-flex flex-wrap gap-2">
                    <button type="button" class="btn btn-outline-primary">Primary</button>
                    <button type="button" class="btn btn-outline-secondary">Secondary</button>
                    <button type="button" class="btn btn-outline-success">Success</button>
                    <button type="button" class="btn btn-outline-info">Info</button>
                    <button type="button" class="btn btn-outline-warning">Warning</button>
                    <button type="button" class="btn btn-outline-danger">Danger</button>
                    <button type="button" class="btn btn-outline-dark">Dark</button>
                    <button type="button" class="btn btn-outline-light text-dark">Light</button>
                </div>
            </section>

            <hr>

            <!-- 3.1c: Kích thước của button -->
            <section class="mb-5">
                <h4>c) Kích thước của button</h4>
                <div class="mt-3 d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-primary btn-lg">Nút to</button>
                    <button type="button" class="btn btn-primary">Kích thước mặc định</button>
                    <button type="button" class="btn btn-primary btn-sm">Nút nhỏ</button>
                </div>
            </section>

            <hr>

            <!-- 3.1d: Thành phần của Button -->
            <section class="mb-5">
                <h4>d) Thành phần của Button</h4>
                <div class="mt-3 d-flex flex-wrap gap-2">
                    <a href="#" class="btn btn-primary">Button chứa link</a>
                    <button type="button" class="btn btn-primary">Button</button>
                    <input type="button" class="btn btn-primary" value="Input Button">
                    <input type="submit" class="btn btn-primary" value="Submit Button">
                </div>
            </section>

            <hr>

            <!-- 3.1e: Trạng thái của nút -->
            <section class="mb-5">
                <h4>e) Trạng thái của nút</h4>
                <div class="mt-3 d-flex flex-wrap gap-2">
                    <button type="button" class="btn btn-primary">Nút bình thường</button>
                    <button type="button" class="btn btn-primary active">Nút có thể click</button>
                    <button type="button" class="btn btn-primary" disabled>Nút không thể click</button>
                    <a href="#" class="btn btn-primary disabled">Link không thể click</a>
                </div>
            </section>

            <hr>

            <!-- 3.1f: Nút đang load -->
            <section class="mb-5">
                <h4>f) Nút đang load</h4>
                <p class="text-muted">Thêm trạng thái đang load cho nút:</p>
                <div class="mt-3 d-flex flex-wrap gap-2">
                    <button class="btn btn-primary" type="button">
                        <span class="spinner-border spinner-border-sm"></span>
                    </button>
                    <button class="btn btn-primary" type="button">
                        <span class="spinner-border spinner-border-sm"></span>
                        Loading..
                    </button>
                    <button class="btn btn-primary" type="button" disabled>
                        <span class="spinner-border spinner-border-sm"></span>
                        Loading..
                    </button>
                    <button class="btn btn-primary" type="button" disabled>
                        <span class="spinner-grow spinner-grow-sm"></span>
                        Loading..
                    </button>
                </div>
            </section>
        </main>

        <footer>
            <!-- place footer here -->
        </footer>

        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
