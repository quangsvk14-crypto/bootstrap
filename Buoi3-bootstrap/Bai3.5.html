        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>

        <main class="container my-5" style="max-width: 750px;">
            <h1 class="mb-4">BÀI TẬP CHƯƠNG 3 - Bài 3.5</h1>

            <section class="mb-5">
                <p class="fw-bold mb-1">a)</p>
                <h3>Xác thực biểu mẫu</h3>
                <p class="text-muted">Ví dụ bạn gửi biểu mẫu nhưng chưa điền hết thông tin thì sẽ nhận được thông báo như bên dưới.</p>

                <form action="/action_page.php" class="was-validated mt-3">
                    
                    <div class="mb-3">
                        <label for="uname" class="form-label">Tên người dùng:</label>
                        <input type="text" class="form-control" id="uname" placeholder="Nhập tên người dùng" name="uname" required>
                        <div class="invalid-feedback">Điền đầy đủ thông tin.</div>
                    </div>

                    <div class="mb-3">
                        <label for="pwd" class="form-label">Mật khẩu:</label>
                        <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd" required>
                        <div class="invalid-feedback">Điền đầy đủ thông tin.</div>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="agreeCheck" name="agree" required>
                        <label class="form-check-label" for="agreeCheck">Đồng ý</label>
                    </div>

                    <button type="submit" class="btn btn-secondary">Đăng nhập</button>
                </form>
            </section>

            <hr class="my-5">

            <section class="mb-5">
                <p class="fw-bold mb-1">b)</p>
                <h3 class="fw-bold mb-4">Registration Form</h3>

                <form action="/action_page.php">
                    <div class="row mb-3">
                        <label for="firstName" class="col-sm-3 col-form-label">First Name:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="firstName" placeholder="First Name">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="lastName" class="col-sm-3 col-form-label">Last Name:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="lastName" placeholder="Last Name">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="emailAddress" class="col-sm-3 col-form-label">Email Address:</label>
                        <div class="col-sm-9">
                            <input type="email" class="form-control" id="emailAddress" placeholder="Email Address">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="mobileNumber" class="col-sm-3 col-form-label">Mobile Number:</label>
                        <div class="col-sm-9">
                            <input type="tel" class="form-control" id="mobileNumber" placeholder="Phone Number">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">Date of Birth:</label>
                        <div class="col-sm-9">
                            <div class="row g-2">
                                <div class="col">
                                    <select class="form-select">
                                        <option selected>Date</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <select class="form-select">
                                        <option selected>Month</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <select class="form-select">
                                        <option selected>Year</option>
                                        <option value="2000">2000</option>
                                        <option value="2001">2001</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="postalAddress" class="col-sm-3 col-form-label">Postal Address:</label>
                        <div class="col-sm-9">
                            <textarea class="form-control" id="postalAddress" rows="3" placeholder="Postal Address"></textarea>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="zipCode" class="col-sm-3 col-form-label">Zip Code:</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="zipCode" placeholder="Zip Code">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="uploadImage" class="col-sm-3 col-form-label">Upload Image:</label>
                        <div class="col-sm-9">
                            <input class="form-control" type="file" id="uploadImage">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">Gender:</label>
                        <div class="col-sm-9 d-flex align-items-center">
                            <div class="form-check me-3">
                                <input class="form-check-input" type="radio" name="gender" id="male" value="male">
                                <label class="form-check-label" for="male">Male</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                                <label class="form-check-label" for="female">Female</label>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-9 offset-sm-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="termsCheck">
                                <label class="form-check-label" for="termsCheck">
                                    I agree to the <a href="#" class="text-decoration-underline">Terms and Conditions</a>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-9 offset-sm-3">
                            <button type="submit" class="btn btn-secondary me-2">Submit</button>
                            <button type="reset" class="btn btn-secondary">Reset</button>
                        </div>
                    </div>
                </form>
            </section>
        </main>
