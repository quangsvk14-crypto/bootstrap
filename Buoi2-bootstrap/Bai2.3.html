<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 2.3: Căn chỉnh hình ảnh</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <style>
            img {
                width: 80px;
                height: 80px;
                object-fit: cover;
            }
        </style>
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>

        <main class="container my-4">
            <p class="mb-1">Left alignment (This is default)</p>
            <div class="mb-4">
                <img src="photo/Anh.jpg" class="rounded" alt="" />
            </div>

            <p class="mb-1">Center alignment using text alignment classes</p>
            <div class="text-center mb-4">
                <img src="photo/Anh.jpg" class="rounded" alt="" />
            </div>

            <p class="mb-1">Right alignment using text alignment classes</p>
            <div class="text-end mb-4">
                <img src="photo/Anh.jpg" class="rounded" alt="" />
            </div>

            <p class="mb-1">Horizontal alignment using float classes</p>
            <div class="clearfix mb-4">
                <img src="photo/Anh.jpg" class="float-start rounded" alt="" />
                <img src="photo/Anh.jpg" class="float-end rounded" alt="" />
            </div>

            <p class="mb-1">Center alignment of block-level image using auto margin</p>
            <div class="mb-4">
                <img src="photo/Anh.jpg" class="mx-auto d-block rounded" alt="" />
            </div>
        </main>

        <footer>
            <!-- place footer here -->
        </footer>

        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
